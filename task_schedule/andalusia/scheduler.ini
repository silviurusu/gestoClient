# Orarul Andalusia, citit de scheduler.py prin [scheduler] schedule_file din config_local.ini.
# Inlocuieste XML-urile de import din task_schedule/andalusia/, sterse odata cu mutarea la
# scheduler.py. WinMentor_verify_running.xml ramane in Task Scheduler: supervizor extern.

# Importul rula la fiecare 15 minute, iar la minutul 0 acelasi proces primea in plus
# --importAvize=1 --importFacturiIntrare=1. De aceea sunt doua job-uri, nu unul cu orar */15
# plus unul la minutul 0: doua job-uri simultane ar porni doua procese main.py deodata, iar al
# doilea ar gasi DocImpServer.exe activ si s-ar opri fara sa faca nimic.
[scheduler:export]
args = --markedForWinMentorExport=1 --exportWinMentorData=1
hour = 6-21
minute = 15,30,45

[scheduler:export_avize]
args = --markedForWinMentorExport=1 --exportWinMentorData=1 --importAvize=1 --importFacturiIntrare=1
hour = 6-21
minute = 0

[scheduler:trace_files]
args = --delete-old-trace-files=1
hour = 20
minute = 43
