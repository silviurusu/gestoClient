# Orarul Carmic, citit de scheduler.py prin [scheduler] schedule_file din config_local.ini.
# Inlocuieste ExportDocumentsAndReportsMarkedFromGesto.xml si WinMentor_remove_old_trace_files.xml.
# WinMentor_verify_running.xml ramane in Task Scheduler: supervizor extern.

# XML: 06:01 la 5 min timp de 12h, apoi 18:06 la 5 min timp de 4h (ultima rulare 22:06).
# Aici minutele se aliniaza la :00 - decalajul de un minut era un artefact al datei de creare -
# iar fereastra tine pana la 22:55, ca un document marcat dupa 22:06 sa nu astepte pana dimineata.
[scheduler:export]
args = --exportWinMentorData=1
hour = 6-22
minute = */5

[scheduler:trace_files]
args = --delete-old-trace-files=1 --days-ago=20
hour = 8
minute = 43
