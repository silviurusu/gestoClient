# Orarul La Nadiniere, citit de scheduler.py prin [scheduler] schedule_file din config_local.ini.
# WinMentor_verify_running.xml ramane in Task Scheduler: supervizor extern.

[scheduler]
# o rulare intepenita in WinMentor ar opri jobul definitiv, fiindca urmatoarele nu mai
# pornesc cat timp una e in curs; dupa atatea secunde e oprita si se reia la rularea urmatoare.
# Acelasi prag il foloseste si main.py: un DocImpServer.exe mai vechi de atat nu mai poate
# apartine unei rulari vii, fiindca rularea care l-a pornit a fost deja oprita
timeout = 600

# Din 5 in 5 minute, 07:00-20:55. Avizele La Nadiniere nu se marcheaza automat la procesare:
# pleaca spre WinMentor doar cele marcate din Gesto, de unde --markedForWinMentorExport.
[scheduler:export]
args = --exportWinMentorData=1 --markedForWinMentorExport=1
hour = 7-20
minute = */5

[scheduler:trace_files]
args = --delete-old-trace-files=1 --days-ago=20
hour = 8
minute = 43
