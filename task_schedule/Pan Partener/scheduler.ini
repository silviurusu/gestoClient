# Orarul Pan Partener, citit de scheduler.py prin [scheduler] schedule_file din config_local.ini.
# Inlocuieste Gesto_documente_si_rapoarte_importavize.xml, Gesto_documente_si_rapoarte.xml
# si WinMentor_remove_old_trace_files.xml.
# WinMentor_verify_running.xml ramane in Task Scheduler: supervizor extern.

[scheduler]
# o rulare intepenita in WinMentor ar opri jobul definitiv, fiindca urmatoarele nu mai
# pornesc cat timp una e in curs; dupa atatea secunde e oprita si se reia la rularea urmatoare.
# Acelasi prag il foloseste si main.py: un DocImpServer.exe mai vechi de atat nu mai poate
# apartine unei rulari vii, fiindca rularea care l-a pornit a fost deja oprita
timeout = 600

# XML: 05:55 la 2 minute timp de 12h, deci minute impare pana la 17:55. Cron nu poate porni
# la :55, asa ca fereastra incepe la 06:01 - primele trei rulari ale zilei nu aveau ce prelua -
# si tine pana la 17:59.
# Minutul 15 lipseste dinadins: acolo ruleaza jobul de mai jos, iar doua rulari pornite in
# aceeasi clipa s-ar bloca una pe alta in DocImpServer.
[scheduler:export]
args = --exportWinMentorData=1 --markedForWinMentorExport=1 --importAvize=1
hour = 6-17
minute = 1-13/2,17-59/2

# O data pe ora exportul ia avizele pe mai multe zile in urma, ca sa prinda ce a scapat
# cat timp WinMentor sau Gesto n-au raspuns. Inainte, minutul era citit din ceas in main.py;
# aici se vede in orar, si se poate schimba fara sa umbli in cod.
[scheduler:export_avize_6_zile]
args = --exportWinMentorData=1 --markedForWinMentorExport=1 --importAvize=1 --days-ago=6
hour = 6-17
minute = 15

# XML: 20:36 la 5 minute timp de o ora, fara --importAvize. Aici fereastra tine 20:00-21:55,
# ca un document marcat dupa 20:00 sa nu astepte pana dimineata.
[scheduler:export_seara]
args = --exportWinMentorData=1 --markedForWinMentorExport=1
hour = 20-21
minute = */5

# XML: main_winmentor.py --delete_older_winmentor=1 --days_ago=20. Scheduler-ul porneste
# numai main.py, deci curatarea trece pe flagul lui, cu acelasi inteles.
[scheduler:trace_files]
args = --delete-old-trace-files=1 --days-ago=20
hour = 8
minute = 43
